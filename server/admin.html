<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Арена: админка</title>
<style>
:root{--bg:#0d0b09;--panel:#17130f;--panel2:#201a14;--line:#3a3024;--gold:#ffd100;--gold2:#c9a54a;--text:#e9e2d0;--dim:#9a8f7a;--chg:#2a4a1c;--chgl:#7ed957;--bad:#ff6b5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Georgia,"Times New Roman",serif}
button,input,textarea{font:inherit;color:inherit}
.btn{background:linear-gradient(#7a1414,#4a0808);border:1px solid #a88a3a;color:var(--gold);padding:6px 14px;border-radius:4px;cursor:pointer}
.btn:hover{filter:brightness(1.2)}.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--panel2);color:var(--text);border-color:var(--line)}
#login{max-width:340px;margin:15vh auto;padding:28px;background:var(--panel);border:1px solid var(--gold2);border-radius:8px;text-align:center}
#login h1{color:var(--gold);font-weight:normal;margin:0 0 18px}
#login input{width:100%;padding:8px;background:#000;border:1px solid var(--line);border-radius:4px;margin-bottom:12px}
.err{color:var(--bad);min-height:1.4em}
#app{display:none;min-height:100vh;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--gold2)}
header h1{margin:0;font-size:20px;color:var(--gold);font-weight:normal}
header .ver{color:var(--dim);margin-left:auto}
nav{background:var(--panel);border-right:1px solid var(--line);padding:10px 0;overflow:auto}
nav h3{margin:14px 16px 6px;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:normal}
nav a{display:flex;align-items:center;gap:8px;padding:6px 16px;color:var(--text);text-decoration:none;cursor:pointer}
nav a:hover{background:var(--panel2)}nav a.on{background:var(--panel2);color:var(--gold);box-shadow:inset 3px 0 var(--gold)}
nav a .n{margin-left:auto;background:var(--chg);color:var(--chgl);border-radius:8px;padding:0 6px;font-size:12px}
main{padding:18px 22px 110px;overflow:auto}
main h2{margin:0 0 4px;color:var(--gold);font-weight:normal}
.sub{color:var(--dim);margin:0 0 16px}
.ic{width:32px;height:32px;flex:none;border:1px solid #000;border-radius:3px;background-image:url(https://switer92.github.io/WoW_Classic_Arena/assets/ui/icons.webp);background-color:#000}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.card .t{display:flex;align-items:center;gap:6px;font-size:15px}.card .t small{color:var(--dim)}
.stt{border-collapse:collapse;width:100%}.stt th{color:var(--gold2);font-weight:normal;text-align:left;padding:4px 8px;white-space:nowrap}.stt th small{color:var(--dim)}.stt td{padding:2px 8px;border-top:1px solid var(--line);vertical-align:top;font-size:13px}.stt td:first-child{color:var(--dim);white-space:nowrap}
.fields{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 14px}
.f{display:flex;flex-direction:column;font-size:12px;color:var(--dim)}
.f input{width:82px;padding:3px 6px;background:#000;border:1px solid var(--line);border-radius:3px;font-size:14px}
.f.arr input{width:50px}.f .row{display:flex;gap:3px}
.f.chg input{border-color:var(--chgl);background:var(--chg)}
.f .def{font-size:11px;color:var(--dim);height:14px}
.f.chg .def{color:var(--chgl)}
.tree{margin-bottom:22px}.tree h3{color:var(--gold2);font-weight:normal;margin:0 0 8px}
.foot{position:fixed;left:220px;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:12px 22px;background:rgba(23,19,15,.97);border-top:1px solid var(--gold2)}
.foot input{flex:1;max-width:420px;padding:6px 8px;background:#000;border:1px solid var(--line);border-radius:4px}
.foot .cnt{color:var(--chgl)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--gold2);border-radius:8px;max-width:640px;width:100%;max-height:80vh;overflow:auto;padding:18px}
.modal h2{margin:0 0 10px;color:var(--gold);font-weight:normal}
.diff{width:100%;border-collapse:collapse;font-size:13px}.diff td{padding:4px 6px;border-bottom:1px solid var(--line)}.diff .o{color:var(--dim);text-decoration:line-through}.diff .nw{color:var(--chgl)}
.hist{width:100%;border-collapse:collapse}.hist td,.hist th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}.hist th{color:var(--dim);font-weight:normal}
.cur{color:var(--gold)}
.ds{color:#c9bfa8;font-size:13px;margin:2px 0 6px}
.rs{margin-left:6px;background:none;border:0;color:var(--gold2);cursor:pointer;padding:0;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}.st{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;color:var(--dim)}.st b{display:block;font-size:28px;color:var(--gold);font-weight:normal}
.h3{color:var(--gold2);font-weight:normal}
.trees{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.ttree{background:#000 center/cover no-repeat;border:1px solid var(--line);border-radius:6px;padding:10px}.ttree h3{margin:0 0 8px;color:var(--gold);font-weight:normal;text-shadow:0 1px 2px #000}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:52px;gap:6px;justify-items:center}
.tal{position:relative;z-index:1;width:42px;height:42px;padding:0;border:1px solid #000;border-radius:3px;background-image:url(https://switer92.github.io/WoW_Classic_Arena/assets/ui/icons.webp);box-shadow:0 0 0 2px #3b3b3b;cursor:pointer}
.tal i{position:absolute;right:-6px;bottom:-6px;font-style:normal;font-size:11px;background:#000;color:var(--chgl);border-radius:3px;padding:0 3px}
.tal.sel{box-shadow:0 0 0 2px var(--gold)}.tal.chg{box-shadow:0 0 0 2px var(--chgl)}.tal.pub{box-shadow:0 0 0 2px var(--gold2)}
.tar{justify-self:center;width:6px;margin:26px 0;background:#e8c440;opacity:.7}.tar.h{width:auto;height:6px;justify-self:stretch;align-self:center;margin:0 25%}
.search{padding:6px 8px;background:#000;border:1px solid var(--line);border-radius:4px;width:260px;margin-bottom:12px}
@media (max-width:760px){#app{grid-template-columns:1fr}nav{grid-row:auto;display:flex;flex-wrap:wrap}nav h3{display:none}.foot{left:0}}
</style>
</head>
<body>
<div id="login"><h1>Админка арены</h1><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><div class="err" id="lerr"></div><button class="btn" id="lbtn">Войти</button></div>
<div id="app">
  <header><h1>Админка арены · баланс</h1><span class="ver" id="ver"></span><button class="btn ghost" id="out">Выйти</button></header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="foot" id="foot" hidden><span class="cnt" id="cnt"></span><input id="note" maxlength="300" placeholder="Комментарий к правке (необязательно)"><button class="btn ghost" id="undo">Сбросить правки</button><button class="btn" id="pub">Опубликовать</button></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script>
"use strict";
const API="/arena/api/";
const CLS={warrior:"Воин",mage:"Маг",rogue:"Разбойник",paladin:"Паладин",priest:"Жрец"};
const LBL={antiCheat:"Античит: 0 = только журнал, 1 = возвращать игрока",acSlack:"Античит: запас к скорости бега, %",acLag:"Античит: допуск на пинг, с",dwMiss:"Доп. промах автоатак с двумя оружиями, %",ap:"Сила атаки",rageFromDamageTaken:"Ярость за 1 полученный урон",stanceRage:"Ярость при смене стойки",locScale:"Окно потери контроля, размер (1 = обычный)",oocHpRegen:"Здоровье вне боя, % в с",polyHpRegen:"Здоровье в овце, % в с",oocManaMult:"Мана вне боя, множитель (в 1.12 нет, 1)",fsr:"Правило 5 секунд: пауза регена маны после траты, с",fsrManaPct:"Реген маны в эти 5 с, % (кроме Медитации)",combatHpRegen:"Здоровье в бою, % в с (в 1.12 нет, 0)",cd:"Восстановление, с",dur:"Длительность, с",range:"Дальность, м",minRange:"Мин. дальность, м",cost:"Стоимость",cast:"Чтение, с",channel:"Канал, с",ticks:"Тиков",dmg:"Урон",heal:"Исцеление",radius:"Радиус, м",slow:"Замедление, %",slowDur:"Замедление, с",root:"Обездвиживание, с",stun:"Оглушение, с",absorb:"Поглощение",lockout:"Блок школы, с",speed:"Скорость, %",dodge:"Уклонение, %",crit:"Крит, %",dot:"Урон доты",dotDur:"Дота, с",total:"Урон всего",chance:"Шанс, %",pct:"Процент",hp:"Здоровье",maxRes:"Макс. ресурс",startRes:"Ресурс на старте",armor:"Броня",interval:"Скорость атаки, с",cp:"Приёмы серии",perCp:"За приём серии",base:"База",charges:"Заряды",window:"Окно, с",haste:"Скорость атаки, %",disarm:"Обезоруживание, с",bonus:"Бонус",reduce:"Снижение, %",ratio:"Мана за урон",rageGain:"Ярость",healReduce:"Снижение лечения, %",healDur:"Снижение лечения, с",manaRegen:"Мана в секунду от духа (через 5 с после траты)",rageDecay:"Потеря ярости вне боя, в с",energyRegen:"Энергия/с",dist:"Расстояние, м",stacks:"Стаки",costUp:"Рост стоимости, %",perSec:"Урон/с",step:"Шаг",v:"Значение за ранг"};
let D,ICONS,over={},edits={},token=sessionStorage.getItem("arenaToken")||"",view="overview",curVer=0,ovTimer=0,talSel=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const get=(o,p)=>p.reduce((a,k)=>a==null?a:a[k],o);
function setp(o,p,v){let a=o;for(let i=0;i<p.length-1;i++)a=a[p[i]]=a[p[i]]&&typeof a[p[i]]==="object"&&!Array.isArray(a[p[i]])?a[p[i]]:{};a[p[p.length-1]]=v;}
function delp(o,p){const a=get(o,p.slice(0,-1));if(a)delete a[p[p.length-1]];}
function flat(o,pre,out){for(const k in o){const v=o[k],p=pre.concat(k);if(v&&typeof v==="object"&&!Array.isArray(v))flat(v,p,out);else out.push([p,v]);}return out}
const iconCss=k=>{const i=ICONS[k]??ICONS.a_q??0;return `background-size:${16*32}px auto;background-position:${-(i%16)*32}px ${-Math.floor(i/16)*32}px`};
async function api(r,o){const h={"content-type":"application/json"};if(token)h.authorization="Bearer "+token;const res=await fetch(API+r,{method:o?"POST":"GET",headers:h,body:o?JSON.stringify(o):undefined});const j=await res.json().catch(()=>({}));if(res.status===401&&r!=="login"){logout();throw new Error(j.error||"Нужен вход")}if(!res.ok)throw new Error(j.error||"Ошибка "+res.status);return j}
function logout(){token="";sessionStorage.removeItem("arenaToken");$("#app").style.display="none";$("#foot").hidden=true;$("#login").style.display="block";}
async function login(){$("#lerr").textContent="";try{const j=await api("login",{password:$("#pw").value});token=j.token;sessionStorage.setItem("arenaToken",token);$("#pw").value="";await start();}catch(e){$("#lerr").textContent=e.message}}
$("#lbtn").onclick=login;$("#pw").onkeydown=e=>{if(e.key==="Enter")login()};$("#out").onclick=logout;
async function load(){const b=await api("balance");over=b.data||{};curVer=b.version;$("#ver").textContent=b.version?`версия ${b.version} · ${new Date(b.at).toLocaleString("ru")}`:"правок ещё нет, всё по умолчанию";}
async function start(){if(!D){const d=await api("defaults");D=d.def;ICONS=d.icons;D.orig=d.orig||{};D.desc=d.desc||{};D.treeBg=d.treeBg||{};D.metaIcon=d.metaIcon||{};}await api("history");await load();edits={};$("#login").style.display="none";$("#app").style.display="grid";render();}
/* значение: черновик → опубликовано → по умолчанию */
const val=p=>{const e=get(edits,p);if(e!==undefined)return e;const o=get(over,p);return o!==undefined?o:get(D,p)};
const nEdits=pre=>flat(edits,[],[]).filter(([p])=>!pre||p.join(".").startsWith(pre)).length;
function field(p,label){const d=get(D,p),v=val(p),o=get(over,p),changed=get(edits,p)!==undefined;const cls="f"+(Array.isArray(d)?" arr":"")+(changed?" chg":"");
  const pub=o!==undefined?o:d,og=p[1]==="abilities"&&D.orig[p[0]]&&D.orig[p[0]][p[2]]?D.orig[p[0]][p[2]][p[3]]:undefined;
  const hint=(changed?`было ${fmt(pub)}`:o!==undefined?`по умолч. ${fmt(d)}`:"")+(og!==undefined?`${changed||o!==undefined?" · ":""}1.12: ${og}`:"");
  const reset=JSON.stringify(v)!==JSON.stringify(d)?`<button class="rs" title="Вернуть значение по умолчанию (${esc(fmt(d))})" data-rs='${esc(JSON.stringify(p))}'>↺</button>`:"";
  const key=esc(JSON.stringify(p));
  const inputs=Array.isArray(d)?`<div class="row">${v.map((x,i)=>`<input data-p='${key}' data-i="${i}" value="${x}" inputmode="decimal">`).join("")}</div>`:`<input data-p='${key}' value="${v}" inputmode="decimal">`;
  return `<label class="${cls}">${esc(label||LBL[p[p.length-1]]||p[p.length-1])}${inputs}<span class="def">${esc(hint)}${reset}</span></label>`}
function numFields(base,obj,skip){return Object.keys(obj).filter(k=>!skip||!skip.includes(k)).filter(k=>typeof obj[k]==="number"||Array.isArray(obj[k])&&obj[k].every(x=>typeof x==="number")).map(k=>field(base.concat(k))).join("")}
function navRender(){const n=$("#nav");let h=`<h3>Общее</h3><a data-v="overview">Обзор</a><a data-v="general">Общие правила${badge("general")}</a><h3>Классы</h3><a data-v="stats">Характеристики классов${["warrior","mage","rogue","paladin","priest"].some(c=>STAT_ROWS.some(r=>nEdits(c+"."+r.join(".")))||nEdits("general.parry."+c))?'<span class="n">•</span>':""}</a>`;
  for(const c in CLS)h+=`<a data-v="cls:${c}"><i class="ic" style="width:20px;height:20px;${smallIcon("cls_"+c,20)}"></i>${CLS[c]}${badge(c)}</a>`;
  h+=`<h3>Таланты</h3>`;for(const c in CLS)h+=`<a data-v="tal:${c}">${CLS[c]}${badge("talents."+c)}</a>`;
  h+=`<h3>Сервер</h3><a data-v="feedback">Отзывы игроков</a><a data-v="roadmap">Дорожная карта</a><a data-v="history">История изменений</a>`;n.innerHTML=h;
  n.querySelectorAll("a").forEach(a=>{a.classList.toggle("on",a.dataset.v===view);a.onclick=()=>{view=a.dataset.v;render()}});}
const badge=pre=>{const k=nEdits(pre);return k?`<span class="n">${k}</span>`:""};
function smallIcon(k,s){const i=ICONS[k]??0;return `background-size:${16*s}px auto;background-position:${-(i%16)*s}px ${-Math.floor(i/16)*s}px`}
const STAT_ROWS=[["hp"],["armor"],["maxRes"],["startRes"],["manaRegen"],["energyRegen"],["crit"],["dodge"],["speed"],["ap"],["swing","interval"],["swing","dmg"],["swing","rage"],["ohSwing","interval"],["ohSwing","dmg"],["ohSwing","pct"],["rageFromDamageTaken"],["stanceRage"]];
const RES_N={mana:"мана",rage:"ярость",energy:"энергия"};
const FBS={new:"Новый",work:"В работе",done:"Сделано",no:"Отклонено"};
async function render(){navRender();const m=$("#main");
  if(view==="stats"){const cl=Object.keys(CLS);
    m.innerHTML=`<h2>Характеристики классов</h2><p class="sub">Основные числа каждого класса рядом для сравнения. Пустая клетка: у класса нет такого параметра. Правки те же, что на странице класса.</p>
    <div class="card" style="display:block;overflow:auto"><table class="stt"><tr><th></th>${cl.map(c=>`<th><i class="ic" style="width:24px;height:24px;vertical-align:middle;${smallIcon("cls_"+c,24)}"></i> ${CLS[c]}<br><small>${RES_N[D[c].res]||""}</small></th>`).join("")}</tr>
    ${STAT_ROWS.filter(r=>cl.some(c=>get(D,[c,...r])!==undefined)).map(r=>`<tr><td>${esc((r[0]==="ohSwing"?"Левая рука: ":r[0]==="swing"?"Автоатака: ":"")+(r[0]==="ohSwing"&&r[1]==="pct"?"% урона":LBL[r[r.length-1]]||r.join(".")))}</td>${cl.map(c=>`<td>${get(D,[c,...r])!==undefined?field([c,...r]," "):""}</td>`).join("")}</tr>`).join("")}
    ${D.general.parry?`<tr><td>Парирование, %</td>${cl.map(c=>`<td>${D.general.parry[c]!==undefined?field(["general","parry",c]," "):""}</td>`).join("")}</tr>`:""}
    </table></div>`;}
  else   if(view==="overview"){m.innerHTML=`<h2>Обзор</h2><p class="sub">Обновляется каждые 15 секунд.</p><div id="ov">Загружаю…</div>`;
    const draw=async()=>{if(view!=="overview")return;try{const o=await api("overview"),el=$("#ov");if(!el)return;
      el.innerHTML=`<div class="stats"><div class="st"><b>${o.online}</b>онлайн сейчас</div><div class="st"><b>${o.fight}</b>в бою</div><div class="st"><b>${o.net}</b>в коопе</div><div class="st"><b>${o.relay.rooms}</b>комнат на сервере</div><div class="st"><b>${o.version||"—"}</b>версия баланса</div><div class="st"><b>${o.overrides}</b>значений изменено</div></div>
      <h3 class="h3">Последняя правка</h3>${o.last?`<div class="card" style="display:block"><div class="t">Версия ${o.last.version} · ${new Date(o.last.at).toLocaleString("ru")}</div><div class="ds">${o.last.note?"Комментарий: "+esc(o.last.note):"Без комментария"}</div>${chTable(o.last.changes)}</div>`:'<p class="sub">Публикаций пока не было, игра работает на значениях по умолчанию.</p>'}`;}catch(e){}};
    draw();clearInterval(ovTimer);ovTimer=setInterval(draw,15000);}
  else if(view==="general"){const g=D.general;m.innerHTML=`<h2>Общие правила</h2><p class="sub">Глобальные числа боя: промахи, броня, убывание контроля, усталость и прочее.</p><div class="card"><div></div><div class="fields">${numFields(["general"],g)}</div></div>`+
    Object.keys(g).filter(k=>g[k]&&typeof g[k]==="object"&&!Array.isArray(g[k])).map(k=>`<div class="card"><div></div><div><div class="t">${esc(k)}</div><div class="fields">${numFields(["general",k],g[k])}</div></div></div>`).join("");}
  else if(view.startsWith("cls:")){const c=view.slice(4),C=D[c],q=(m.querySelector(".search")||{}).value||"";
    m.innerHTML=`<h2>${CLS[c]}</h2><p class="sub">Характеристики класса и все его способности. Зелёным подсвечены несохранённые правки.</p>
    <input class="search" placeholder="Поиск способности" value="${esc(q)}">
    <div class="card"><i class="ic" style="${iconCss("cls_"+c)}"></i><div><div class="t">Класс</div><div class="fields">${numFields([c],C)}${C.swing?numFields([c,"swing"],C.swing):""}</div></div></div>
    ${Object.keys(C.abilities).filter(id=>!q||C.abilities[id].name.toLowerCase().includes(q.toLowerCase())).map(id=>{const a=C.abilities[id];return `<div class="card"><i class="ic" style="${iconCss(D.metaIcon[id]||id)}"></i><div><div class="t">${esc(a.name)} <small>${id}</small></div>${D.desc[c]&&D.desc[c][id]?`<div class="ds">${esc(D.desc[c][id])}</div>`:""}<div class="fields">${numFields([c,"abilities",id],a)||'<span class="f">нет числовых параметров</span>'}</div></div></div>`}).join("")}
    ${C.poisons?`<h3 style="color:var(--gold2);font-weight:normal">Яды</h3>`+Object.keys(C.poisons).map(k=>`<div class="card"><i class="ic" style="${iconCss(k)}"></i><div><div class="t">${esc(C.poisons[k].name)}</div><div class="fields">${numFields([c,"poisons",k],C.poisons[k])}</div></div></div>`).join(""):""}`;
    const s=m.querySelector(".search");s.oninput=()=>{const pos=s.selectionStart;render().then(()=>{const n=m.querySelector(".search");n.focus();n.setSelectionRange(pos,pos)})};}
  else if(view.startsWith("tal:")){const c=view.slice(4),T=D.talents[c];
    m.innerHTML=`<h2>Таланты: ${CLS[c]}</h2><p class="sub">Нажмите на талант, чтобы изменить его. «Значение за ранг» подставляется в описание вместо {x}.</p><div class="trees">`+
    Object.keys(T).map(tr=>{const bg=D.treeBg[c]&&D.treeBg[c][tr];const L=T[tr].list;
      const arrows=Object.keys(L).filter(id=>L[id].req&&L[L[id].req]).map(id=>{const d=L[id],q=L[d.req];return q.t===d.t?`<div class="tar h" style="grid-row:${d.t};grid-column:${Math.min(q.c,d.c)}/${Math.max(q.c,d.c)+1}"></div>`:`<div class="tar" style="grid-row:${q.t}/${d.t+1};grid-column:${d.c}"></div>`}).join("");
      return `<div class="ttree" style="${bg?`background-image:url(${ASSET}tree_${bg}.webp)`:""}"><h3>${esc(T[tr].name)}</h3><div class="tgrid">${arrows}${Object.keys(L).map(id=>{const t=L[id],chg=nEdits("talents."+c+"."+tr+".list."+id),pubd=get(over,["talents",c,tr,"list",id])!==undefined;
        return `<button class="tal${talSel===id?" sel":""}${chg?" chg":pubd?" pub":""}" data-tal="${tr}|${id}" title="${esc(t.n)}" style="grid-row:${t.t};grid-column:${t.c};${smallIcon(id,40)}"><i>${t.max}</i></button>`}).join("")}</div></div>`}).join("")+`</div><div id="tedit"></div>`;
    m.querySelectorAll("[data-tal]").forEach(b=>b.onclick=()=>{talSel=b.dataset.tal.split("|")[1];render()});
    const tr=talSel&&Object.keys(T).find(k=>T[k].list[talSel]);
    if(tr){const t=T[tr].list[talSel],v=val(["talents",c,tr,"list",talSel,"v"]),x=r=>Array.isArray(v)?v[r-1]:+(v*r).toFixed(2);
      $("#tedit").innerHTML=`<div class="card"><i class="ic" style="${iconCss(talSel)}"></i><div><div class="t">${esc(t.n)} <small>${esc(T[tr].name)} · ряд ${t.t} · рангов ${t.max}${t.req?` · требует «${esc(T[tr].list[t.req].n)}» ${t.reqr}`:""}</small></div>
        <div class="ds">${[...Array(t.max)].map((_,i)=>`<b>Ранг ${i+1}:</b> ${esc(t.d.replace("{x}",x(i+1)))}`).join("<br>")}</div><div class="fields">${field(["talents",c,tr,"list",talSel,"v"])}</div></div></div>`;}}
  else if(view==="feedback"){m.innerHTML=`<h2>Отзывы игроков</h2><p class="sub">Баги и предложения из кнопки «Отзыв» в игре.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><select id="fk"><option value="">Все типы</option><option value="bug">Баги</option><option value="idea">Предложения</option></select>
    <select id="fs"><option value="open">Открытые</option><option value="">Все статусы</option>${Object.entries(FBS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
    <select id="fo"><option value="new">Сначала новые</option><option value="old">Сначала старые</option></select><input id="fq" placeholder="Поиск по тексту" style="flex:1;min-width:140px"><button class="btn ghost" id="fdelall">Удалить все показанные</button></div><div id="fl">Загружаю…</div>`;
    let all=[],shown=[];const draw=()=>{const k=$("#fk").value,st=$("#fs").value,q=$("#fq").value.toLowerCase();
      let l=all.filter(x=>(!k||x.kind===k)&&(st==="open"?x.status==="new"||x.status==="work":!st||x.status===st)&&(!q||(x.text+" "+x.nick).toLowerCase().includes(q)));
      if($("#fo").value==="new")l=l.slice().reverse();shown=l;
      $("#fl").innerHTML=l.length?`<table class="hist"><tr><th>Когда</th><th>Тип</th><th>Текст</th><th>Игрок</th><th>Статус</th><th></th></tr>${l.map(x=>`<tr><td>${new Date(x.at).toLocaleString("ru")}<br><span style="color:var(--dim)">${esc(x.ver)}</span></td><td>${x.kind==="bug"?"🐞 Баг":"💡 Идея"}</td><td style="white-space:pre-wrap;max-width:520px">${esc(x.text)}</td><td>${esc(x.nick||"—")}<br><span style="color:var(--dim)">${esc(x.cls)}</span></td><td><select data-fs="${x.id}">${Object.entries(FBS).map(([s,v])=>`<option value="${s}"${s===x.status?" selected":""}>${v}</option>`).join("")}</select></td><td><button class="btn ghost" data-fd="${x.id}">Удалить</button>${x.ip?` <button class="btn ghost" data-fb="${x.id}" title="Удалить все отзывы с этого адреса и больше не принимать">Бан адреса</button>`:""}</td></tr>`).join("")}</table>`:"Отзывов нет.";
      $("#fl").querySelectorAll("[data-fs]").forEach(e=>e.onchange=async()=>{await api("feedback/set",{id:e.dataset.fs,status:e.value});all.find(x=>x.id===e.dataset.fs).status=e.value;});
      $("#fl").querySelectorAll("[data-fb]").forEach(e=>e.onclick=async()=>{const ip=all.find(x=>x.id===e.dataset.fb).ip;if(!confirm("Удалить все отзывы с этого адреса ("+all.filter(x=>x.ip===ip).length+" шт.) и больше не принимать с него?"))return;await api("feedback/set",{id:e.dataset.fb,ban:1});all=all.filter(x=>x.ip!==ip);draw();});
      $("#fl").querySelectorAll("[data-fd]").forEach(e=>e.onclick=async()=>{if(!confirm("Удалить отзыв?"))return;await api("feedback/set",{id:e.dataset.fd,del:1});all=all.filter(x=>x.id!==e.dataset.fd);draw();});};
    ["#fk","#fs","#fo"].forEach(q=>$(q).onchange=draw);
    $("#fdelall").onclick=async()=>{if(!shown.length||!confirm("Удалить все показанные отзывы ("+shown.length+" шт.)?"))return;for(const x of shown.slice()){try{await api("feedback/set",{id:x.id,del:1});}catch(e){}all=all.filter(y=>y!==x);}draw();};$("#fq").oninput=draw;
    try{all=(await api("feedback")).list;draw();}catch(e){$("#fl").textContent=e.message}}
  else if(view==="roadmap"){m.innerHTML=`<h2>Дорожная карта</h2><p class="sub">Видна игрокам по кнопке «Дорожная карта». Порядок в списке = порядок в игре.</p><div id="rl">Загружаю…</div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn ghost" id="radd">+ Пункт</button><button class="btn" id="rsave">Сохранить</button><span id="rmsg" style="color:var(--dim);align-self:center"></span></div>`;
    let L=[];const RS={plan:"В планах",work:"В работе",done:"Готово"};
    const draw=()=>{$("#rl").innerHTML=L.length?L.map((x,i)=>`<div class="card" style="display:grid;gap:6px;margin-bottom:8px"><div style="display:flex;gap:6px"><input data-i="${i}" data-f="title" value="${esc(x.title)}" placeholder="Название" style="flex:1">
      <select data-i="${i}" data-f="status">${Object.entries(RS).map(([k,v])=>`<option value="${k}"${k===x.status?" selected":""}>${v}</option>`).join("")}</select>
      <button class="btn ghost" data-up="${i}">↑</button><button class="btn ghost" data-dn="${i}">↓</button><button class="btn ghost" data-rm="${i}">Удалить</button></div>
      <textarea data-i="${i}" data-f="desc" rows="2" placeholder="Описание (необязательно)" style="width:100%;box-sizing:border-box">${esc(x.desc||"")}</textarea></div>`).join(""):"Пунктов пока нет.";
      $("#rl").querySelectorAll("[data-f]").forEach(e=>e.oninput=e.onchange=()=>{L[+e.dataset.i][e.dataset.f]=e.value;$("#rmsg").textContent="есть несохранённые изменения";});
      const mv=(i,j)=>{if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];draw();};
      $("#rl").querySelectorAll("[data-up]").forEach(e=>e.onclick=()=>mv(+e.dataset.up,+e.dataset.up-1));
      $("#rl").querySelectorAll("[data-dn]").forEach(e=>e.onclick=()=>mv(+e.dataset.dn,+e.dataset.dn+1));
      $("#rl").querySelectorAll("[data-rm]").forEach(e=>e.onclick=()=>{L.splice(+e.dataset.rm,1);draw();});};
    $("#radd").onclick=()=>{L.push({title:"",desc:"",status:"plan"});draw();};
    $("#rsave").onclick=async()=>{try{L=(await api("roadmap",{list:L})).list;draw();$("#rmsg").textContent="сохранено";}catch(e){$("#rmsg").textContent=e.message}};
    try{L=(await api("roadmap")).list;draw();}catch(e){$("#rl").textContent=e.message}}
  else if(view==="history"){m.innerHTML=`<h2>История изменений</h2><p class="sub">Каждая публикация сохраняется. Откат публикует выбранную версию заново.</p><div id="hl">Загружаю…</div>`;
    try{const h=await api("history");$("#hl").innerHTML=h.list.length?`<table class="hist"><tr><th>Версия</th><th>Когда</th><th>Что изменилось</th><th>Комментарий</th><th></th></tr>${h.list.map(v=>`<tr><td class="${v.version===h.current?"cur":""}">${v.version}${v.version===h.current?" · сейчас":""}</td><td>${new Date(v.at).toLocaleString("ru")}</td><td>${chList(v.changes)}</td><td>${esc(v.note||"")}</td><td>${v.version===h.current?"":`<button class="btn ghost" data-rb="${v.version}">Откатить</button>`}</td></tr>`).join("")}</table>`:"Публикаций пока не было.";
      $("#hl").querySelectorAll("[data-rb]").forEach(b=>b.onclick=async()=>{if(!confirm("Откатить баланс к версии "+b.dataset.rb+"?"))return;await api("rollback",{version:+b.dataset.rb});await load();render();});}catch(e){$("#hl").textContent=e.message}}
  m.querySelectorAll("input[data-p]").forEach(inp=>inp.onchange=()=>{const p=JSON.parse(inp.dataset.p),d=get(D,p),cur=get(over,p)!==undefined?get(over,p):d;
    let v=parseFloat(inp.value.replace(",","."));if(!isFinite(v)){inp.value=Array.isArray(d)?val(p)[+inp.dataset.i]:val(p);return}
    if(Array.isArray(d)){const arr=val(p).slice();arr[+inp.dataset.i]=v;v=arr;}
    if(JSON.stringify(v)===JSON.stringify(cur))delp(edits,p);else setp(edits,p,v);
    const k=scrollY;render().then(()=>scrollTo(0,k));});
  m.querySelectorAll("[data-rs]").forEach(b=>b.onclick=e=>{e.preventDefault();const p=JSON.parse(b.dataset.rs),d=get(D,p),cur=get(over,p)!==undefined?get(over,p):d;
    if(JSON.stringify(d)===JSON.stringify(cur))delp(edits,p);else setp(edits,p,Array.isArray(d)?d.slice():d);const k=scrollY;render().then(()=>scrollTo(0,k));});
  const n=nEdits();$("#foot").hidden=false;$("#cnt").textContent=n?`Несохранённых правок: ${n}`:"Правок нет";$("#pub").disabled=!n;$("#undo").disabled=!n;}
const nameOf=p=>{if(p[0]==="talents"){const t=get(D,p.slice(0,5));return `Талант «${t.n}»`}const a=p[1]==="abilities"||p[1]==="poisons"?get(D,p.slice(0,3)):null;return (CLS[p[0]]||"Общее")+(a?` · ${a.name}`:"")+" · "+(LBL[p[p.length-1]]||p.slice(1).join("."))};
const fmt=v=>Array.isArray(v)?v.join("–"):v;
const chTable=l=>l&&l.length?`<table class="diff">${l.map(c=>`<tr><td>${esc(nameOf(c.p))}</td><td class="o">${esc(fmt(c.from))}</td><td class="nw">${esc(fmt(c.to))}</td></tr>`).join("")}</table>`:'<p class="sub">Изменений нет.</p>';
const chList=l=>l&&l.length?l.slice(0,6).map(c=>`${esc(nameOf(c.p))}: ${esc(fmt(c.from))} → <span style="color:var(--chgl)">${esc(fmt(c.to))}</span>`).join("<br>")+(l.length>6?`<br>и ещё ${l.length-6}`:""):"—";
const ASSET="https://switer92.github.io/WoW_Classic_Arena/assets/ui/";
$("#undo").onclick=()=>{edits={};render()};
$("#pub").onclick=()=>{const list=flat(edits,[],[]);$("#mbox").innerHTML=`<h2>Опубликовать ${list.length} правок?</h2><p class="sub">Игра возьмёт новые значения со следующего боя у всех игроков.</p><table class="diff">${list.map(([p,v])=>{const o=get(over,p)!==undefined?get(over,p):get(D,p);return `<tr><td>${esc(nameOf(p))}</td><td class="o">${esc(fmt(o))}</td><td class="nw">${esc(fmt(v))}</td></tr>`}).join("")}</table><p style="display:flex;gap:10px;justify-content:flex-end;margin:16px 0 0"><button class="btn ghost" id="mno">Отмена</button><button class="btn" id="myes">Опубликовать</button></p>`;
  $("#modal").style.display="flex";$("#mno").onclick=()=>$("#modal").style.display="none";
  $("#myes").onclick=async()=>{$("#myes").disabled=true;try{const data=JSON.parse(JSON.stringify(over));for(const [p,v] of list){const d=get(D,p);if(JSON.stringify(v)===JSON.stringify(d))delp(data,p);else setp(data,p,v);}
    await api("balance",{data,note:$("#note").value});$("#note").value="";edits={};await load();$("#modal").style.display="none";render();}catch(e){alert(e.message);$("#myes").disabled=false;}};};
if(token)start().catch(()=>logout());
</script>
</body>
</html>
